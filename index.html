<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосование</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Montserrat', Arial, sans-serif;
            overflow: hidden;
        }
        body {
            background: url('img/bg.jpg') center/cover no-repeat fixed;
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.05);
            pointer-events: none;
            z-index: 1;
        }

        /* ---- QR-код: большой, по центру между BOY и GIRL ---- */
        .qr-top {
            position: absolute;
            z-index: 2;
            /* Подбери значения, если нужно сдвинуть */
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.98);
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            text-align: center;
        }
        .qr-top img {
            display: block;
            /* Размер QR: 38% от меньшей стороны экрана */
            width: 38vh;
            height: 38vh;
            max-width: 400px;
            max-height: 400px;
        }
        .qr-top .caption {
            font-size: 14px;
            color: #4a1f1f;
            margin-top: 6px;
            font-weight: 800;
        }

        /* ---- Плашка "Мальчик" — под сердечком слева ---- */
        .stat-boy {
            position: absolute;
            z-index: 2;
            /* Под сердечком в слове BOY: левый край, чуть ниже середины */
            left: 4%;
            top: 55%;
            width: 22%;
            min-width: 150px;
            max-width: 240px;
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            padding: 14px 12px;
            text-align: center;
            box-shadow: 0 6px 24px rgba(0,0,0,0.18);
            border-top: 5px solid #4a90d9;
            backdrop-filter: blur(6px);
        }
        .stat-boy .title { font-size: 15px; font-weight: 800; color: #4a90d9; margin-bottom: 6px; }
        .stat-boy .num { font-size: 34px; font-weight: 900; color: #4a1f1f; line-height: 1; }
        .stat-boy .sub { font-size: 11px; color: #888; margin-top: 3px; }
        .stat-boy .money { font-size: 19px; font-weight: 900; color: #8b0000; margin-top: 8px; }

        /* ---- Плашка "Девочка" — над сердечком справа ---- */
        .stat-girl {
            position: absolute;
            z-index: 2;
            /* Над сердечком в слове GIRL: правый край, чуть выше середины */
            right: 4%;
            top: 22%;
            width: 22%;
            min-width: 150px;
            max-width: 240px;
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            padding: 14px 12px;
            text-align: center;
            box-shadow: 0 6px 24px rgba(0,0,0,0.18);
            border-top: 5px solid #e8a0b4;
            backdrop-filter: blur(6px);
        }
        .stat-girl .title { font-size: 15px; font-weight: 800; color: #e8a0b4; margin-bottom: 6px; }
        .stat-girl .num { font-size: 34px; font-weight: 900; color: #4a1f1f; line-height: 1; }
        .stat-girl .sub { font-size: 11px; color: #888; margin-top: 3px; }
        .stat-girl .money { font-size: 19px; font-weight: 900; color: #8b0000; margin-top: 8px; }

        /* ---- Кнопка "Пожертвовать" внизу по центру ---- */
        .donate-wrap {
            position: absolute;
            z-index: 2;
            left: 50%;
            bottom: 3%;
            transform: translateX(-50%);
        }
        .btn-donate {
            background: #c9a227;
            color: #fff;
            padding: 14px 40px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 6px 24px rgba(201,162,39,0.55);
            transition: transform 0.15s;
            display: inline-block;
        }
        .btn-donate:active { transform: scale(0.97); }

        /* ---- Адаптация под телефон ---- */
        @media (max-width: 768px) {
            .qr-top img {
                width: 42vw;
                height: 42vw;
                max-width: none;
                max-height: none;
            }
            .stat-boy {
                left: 3%;
                top: 58%;
                width: 30%;
                min-width: 110px;
                padding: 10px 8px;
            }
            .stat-girl {
                right: 3%;
                top: 20%;
                width: 30%;
                min-width: 110px;
                padding: 10px 8px;
            }
            .stat-boy .num, .stat-girl .num { font-size: 26px; }
            .stat-boy .title, .stat-girl .title { font-size: 12px; }
            .stat-boy .money, .stat-girl .money { font-size: 15px; }
            .stat-boy .sub, .stat-girl .sub { font-size: 9px; }
        }
    </style>
</head>
<body>

    <!-- QR-код: большой, по центру -->
    <div class="qr-top">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=https://pdima20020805-maker.github.io/sbor/vote.html" alt="QR">
        <div class="caption">Отсканируй и проголосуй</div>
    </div>

    <!-- Плашка "Мальчик" — под сердечком слева -->
    <div class="stat-boy">
        <div class="title">👦 Мальчик</div>
        <div class="num" id="boyCount">0</div>
        <div class="sub">голосов</div>
        <div class="money" id="boySum">0 ₽</div>
    </div>

    <!-- Плашка "Девочка" — над сердечком справа -->
    <div class="stat-girl">
        <div class="title">👧 Девочка</div>
        <div class="num" id="girlCount">0</div>
        <div class="sub">голосов</div>
        <div class="money" id="girlSum">0 ₽</div>
    </div>

    <!-- Кнопка "Пожертвовать" -->
    <div class="donate-wrap">
        <a class="btn-donate" href="https://t.tb.ru/pm_short/7BhMZ0EUAbW" target="_blank">💛 Пожертвовать</a>
    </div>

    <script>
        const BIN_ID  = '6abcae01ffd5d160533e0111';
        const API_KEY = '$2a$10$rBFle0OkeFzCiBUYUF5zjuDyuAqVnc5YK41ETmqtoQmkWKoX3vPQ6';

        async function loadData() {
            try {
                const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await r.json();
                const d = data.record || {};
                document.getElementById('boyCount').textContent  = d.boy || 0;
                document.getElementById('girlCount').textContent = d.girl || 0;
                document.getElementById('boySum').textContent    = (d.boy_sum || 0) + ' ₽';
                document.getElementById('girlSum').textContent   = (d.girl_sum || 0) + ' ₽';
            } catch (e) {
                console.log('Ошибка загрузки:', e);
            }
        }

        loadData();
        setInterval(loadData, 5000);
    </script>

</body>
</html>
