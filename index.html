<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пожертвование</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Montserrat', Arial, sans-serif;
            overflow: hidden;
        }
        body {
            background: url('img/bg.jpg') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.15);
            pointer-events: none;
            z-index: 0;
        }

        /* QR-код для оплаты */
        .qr-block {
            position: relative;
            z-index: 1;
            background: #ffffff;
            padding: 18px;
            border-radius: 22px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 90vw;
        }
        .qr-block img {
            display: block;
            width: 70vmin;              /* крупный, адаптивный размер */
            height: 70vmin;
            max-width: 480px;
            max-height: 480px;
            object-fit: contain;
        }
        .qr-block .caption {
            margin-top: 12px;
            font-size: 15px;
            color: #4a1f1f;
            font-weight: 800;
        }
        .qr-block .sub {
            margin-top: 4px;
            font-size: 13px;
            color: #888;
        }

        @media (max-width: 480px) {
            .qr-block img { width: 82vw; height: 82vw; }
            .qr-block .caption { font-size: 14px; }
            .qr-block .sub { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="qr-block">
        <img src="img/qr-pay.png" alt="QR-код для оплаты">
        <div class="caption">Отсканируйте QR-код для перевода</div>
        <div class="sub">Парфенов Дмитрий Андреевич</div>
    </div>

</body>
</html>
