<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пожертвование</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: 'Montserrat', Arial, sans-serif;
            overflow: hidden;
        }
        body {
            /* Убрали картинку, поставили бордовый цвет (в тон твоему сайту) */
            background: #4a1f1f; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* QR-код для оплаты */
        .qr-block {
            position: relative;
            z-index: 1;
            background: #ffffff;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.6); /* Сделали тень чуть темнее для контраста */
            text-align: center;
            max-width: 90vw;
        }
        .qr-block img {
            display: block;
            width: 70vmin;              /* крупный, адаптивный размер */
            height: 70vmin;
            max-width: 480px;
            max-height: 480px;
            object-fit: contain;
        }
        .qr-block .caption {
            margin-top: 14px;
            font-size: 16px;
            color: #4a1f1f;             /* Текст тоже бордовый */
            font-weight: 800;
        }
        .qr-block .sub {
            margin-top: 4px;
            font-size: 14px;
            color: #888;
        }

        @media (max-width: 480px) {
            .qr-block img { width: 85vw; height: 85vw; }
            .qr-block .caption { font-size: 15px; }
            .qr-block .sub { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="qr-block">
        <img src="img/qr-pay.png" alt="QR-код для оплаты">
        <div class="caption">Отсканируйте QR-код для перевода</div>
        <div class="sub">Парфенов Дмитрий Андреевич</div>
    </div>

</body>
</html>
