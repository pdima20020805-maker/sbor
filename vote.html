<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосование</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Montserrat', Arial, sans-serif; }
        body {
            background: url('img/bg.jpg') center/cover no-repeat fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.2);
            pointer-events: none;
        }
        .wrap { position: relative; z-index: 1; width: 100%; max-width: 420px; text-align: center; }
        h1 { color: #4a1f1f; font-size: 22px; margin-bottom: 24px; }

        .choice {
            display: block;
            width: 100%;
            padding: 22px;
            margin-bottom: 16px;
            border: none;
            border-radius: 18px;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(0,0,0,0.15);
            transition: transform 0.15s;
            text-decoration: none;
            text-align: center;
        }
        .choice:active { transform: scale(0.97); }
        .choice.boy { background: #4a90d9; }
        .choice.girl { background: #e8a0b4; }
        .choice.donate { background: #c9a227; margin-top: 20px; font-size: 17px; padding: 18px; }

        .status {
            margin-top: 16px;
            background: rgba(255,255,255,0.9);
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            color: #2a7a2a;
            display: none;
        }
        .status.show { display: block; }
    </style>
</head>
<body>

    <div class="wrap">
        <h1>Проголосуй!</h1>

        <button class="choice boy" id="boyBtn" onclick="vote('boy')">👦 Мальчик</button>
        <button class="choice girl" id="girlBtn" onclick="vote('girl')">👧 Девочка</button>

        <!-- ⚠️ Замени ССЫЛКА_НА_ПЕРЕВОД на свою -->
        <a class="choice donate" href="https://t.tb.ru/pm_short/2pztjHHrZMQ" target="_blank">💛 Пожертвовать</a>

        <div class="status" id="status"></div>
    </div>

    <script>
        const NAMESPACE = 'sbor2026';

        async function vote(gender) {
            const key = 'voted_' + gender;
            const status = document.getElementById('status');

            if (localStorage.getItem(key)) {
                status.textContent = 'Вы уже голосовали за этого варианта с этого устройства';
                status.classList.add('show');
                return;
            }

            try {
                const r = await fetch(`https://api.countapi.xyz/hit/${NAMESPACE}/${gender}`).then(r => r.json());
                localStorage.setItem(key, '1');
                status.textContent = '✅ Ваш голос учтён! Спасибо 💛';
                status.classList.add('show');
                document.getElementById('boyBtn').disabled = true;
                document.getElementById('girlBtn').disabled = true;
            } catch (e) {
                status.textContent = 'Ошибка, попробуйте позже';
                status.classList.add('show');
            }
        }

        // Если уже голосовал — сразу блокируем
        if (localStorage.getItem('voted_boy') || localStorage.getItem('voted_girl')) {
            document.getElementById('boyBtn').disabled = true;
            document.getElementById('girlBtn').disabled = true;
        }
    </script>

</body>
</html>
